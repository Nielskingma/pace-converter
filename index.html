<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pace">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="manifest.json">
  <title>Pace Converter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      gap: 0;
    }

    .app {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .title {
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fff;
    }

    /* --- CARD --- */
    .card {
      background: #161616;
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fff;
    }

    /* --- PACE INPUT --- */
    .pace-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .time-field {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .time-field label {
      font-size: 11px;
      color: #fff;
      font-weight: 500;
    }

    .time-field input {
      width: 100%;
      background: #222;
      border: 1.5px solid #2a2a2a;
      border-radius: 12px;
      color: #fff;
      font-size: 36px;
      font-weight: 300;
      text-align: center;
      padding: 8px 8px;
      outline: none;
      transition: border-color 0.15s;
      font-variant-numeric: tabular-nums;
      -webkit-appearance: none;
      appearance: none;
    }

    .time-field input:focus {
      border-color: #4ade80;
    }

    .time-field input::placeholder { color: #333; }

    .colon {
      font-size: 32px;
      font-weight: 300;
      color: #444;
      padding-bottom: 16px;
      user-select: none;
    }

    .unit-label {
      font-size: 13px;
      color: #555;
      font-weight: 400;
      text-align: right;
      margin-top: -8px;
    }

    /* --- RESULT --- */
    .result-card {
      background: #161616;
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .result-value {
      font-size: 56px;
      font-weight: 200;
      letter-spacing: -2px;
      color: #4ade80;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .result-value span.decimal {
      font-size: 42px;
      color: #2a9b55;
    }

    .result-unit {
      font-size: 14px;
      color: #fff;
      font-weight: 400;
    }

    /* --- DIVIDER --- */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #222;
    }

    .divider-icon {
      font-size: 14px;
      color: #333;
    }

    /* --- REVERSE SECTION --- */
    .reverse-section {
      background: #161616;
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .speed-input-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .speed-input-row input {
      flex: 1;
      background: #222;
      border: 1.5px solid #2a2a2a;
      border-radius: 12px;
      color: #fff;
      font-size: 36px;
      font-weight: 300;
      text-align: center;
      padding: 8px 8px;
      outline: none;
      transition: border-color 0.15s;
      font-variant-numeric: tabular-nums;
      -webkit-appearance: none;
      appearance: none;
    }

    .speed-input-row input:focus {
      border-color: #4ade80;
    }

    .speed-input-row input::placeholder { color: #333; }

    .speed-unit {
      font-size: 14px;
      color: #fff;
      font-weight: 400;
      min-width: 36px;
    }

    .reverse-result {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .reverse-result-value {
      font-size: 46px;
      font-weight: 200;
      letter-spacing: -1px;
      color: #4ade80;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .reverse-result-unit {
      font-size: 14px;
      color: #fff;
    }

    /* --- AVG RESULT --- */
    .avg-result {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .avg-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

  </style>
</head>
<body>
  <div class="app">
    <div class="title">Pace Converter</div>

    <!-- PACE → KM/H -->
    <div class="card">
      <div class="card-label">Min/km → km/u</div>
      <div class="pace-input-row">
        <div class="time-field">
          <input type="number" id="minutes" inputmode="numeric" min="0" max="99" placeholder="0" maxlength="2">
          <label>min</label>
        </div>
        <div class="colon">:</div>
        <div class="time-field">
          <input type="number" id="seconds" inputmode="numeric" min="0" max="59" placeholder="00" maxlength="2">
          <label>sec</label>
        </div>
      </div>
    </div>

    <div class="result-card">
      <div class="card-label">Snelheid</div>
      <div class="result-value" id="kph-display">—</div>
      <div class="result-unit">kilometer per uur</div>
    </div>

    <div class="divider"><span class="divider-icon">⇅</span></div>

    <!-- KM/H → PACE -->
    <div class="reverse-section">
      <div class="card-label">km/u → min/km</div>
      <div class="speed-input-row">
        <input type="number" id="speed" inputmode="decimal" min="0" max="99" step="0.1" placeholder="0.0">
        <div class="speed-unit">km/u</div>
      </div>
      <div class="reverse-result">
        <div class="reverse-result-value" id="pace-display">—</div>
        <div class="reverse-result-unit">min per kilometer</div>
      </div>
    </div>

    <div class="divider"><span class="divider-icon">⇅</span></div>

    <!-- TOTAALTIJD + AFSTAND → SNELHEID -->
    <div class="card">
      <div class="card-label">Tijd + afstand → snelheid</div>
      <div class="pace-input-row">
        <div class="time-field">
          <input type="number" id="total-h" inputmode="numeric" min="0" max="99" placeholder="0">
          <label>uur</label>
        </div>
        <div class="colon">:</div>
        <div class="time-field">
          <input type="number" id="total-m" inputmode="numeric" min="0" max="59" placeholder="00">
          <label>min</label>
        </div>
        <div class="colon">:</div>
        <div class="time-field">
          <input type="number" id="total-s" inputmode="numeric" min="0" max="59" placeholder="00">
          <label>sec</label>
        </div>
      </div>
      <div class="speed-input-row">
        <input type="number" id="total-dist" inputmode="decimal" min="0" step="0.01" placeholder="0.00">
        <div class="speed-unit">km</div>
      </div>
    </div>

    <div class="result-card">
      <div class="card-label">Gemiddelde snelheid</div>
      <div class="avg-result">
        <div class="avg-row">
          <div class="result-value" id="avg-kph">—</div>
          <div class="result-unit">kilometer per uur</div>
        </div>
        <div class="avg-row">
          <div class="reverse-result-value" id="avg-pace">—</div>
          <div class="reverse-result-unit">min per kilometer</div>
        </div>
      </div>
    </div>

  </div>

  <script>
    function paceToKph(min, sec) {
      const totalMin = min + sec / 60;
      if (totalMin <= 0) return null;
      return 60 / totalMin;
    }

    function kphToPace(kph) {
      if (kph <= 0) return null;
      const totalMin = 60 / kph;
      const m = Math.floor(totalMin);
      const s = Math.round((totalMin - m) * 60);
      return { m, s };
    }

    function formatKph(v) {
      if (v === null) return '—';
      const str = v.toFixed(2);
      const [int, dec] = str.split('.');
      return `${int}<span class="decimal">.${dec}</span>`;
    }

    function formatPace(p) {
      if (!p) return '—';
      const s = p.s === 60 ? (p.m + 1 + ':00') : `${p.m}:${String(p.s).padStart(2,'0')}`;
      return p.s === 60 ? s : `${p.m}:${String(p.s).padStart(2,'0')}`;
    }

    // Pace → kph
    const mInput = document.getElementById('minutes');
    const sInput = document.getElementById('seconds');
    const kphDisplay = document.getElementById('kph-display');

    function updateKph() {
      const m = parseInt(mInput.value) || 0;
      const s = parseInt(sInput.value) || 0;
      if (m === 0 && s === 0) { kphDisplay.innerHTML = '—'; return; }
      const v = paceToKph(m, s);
      kphDisplay.innerHTML = formatKph(v);
    }

    mInput.addEventListener('input', () => {
      if (mInput.value.length >= 2) sInput.focus();
      updateKph();
    });

    sInput.addEventListener('input', () => {
      let v = parseInt(sInput.value);
      if (v > 59) sInput.value = 59;
      updateKph();
    });

    // kph → pace
    const speedInput = document.getElementById('speed');
    const paceDisplay = document.getElementById('pace-display');

    speedInput.addEventListener('input', () => {
      const v = parseFloat(speedInput.value);
      if (!v) { paceDisplay.textContent = '—'; return; }
      const p = kphToPace(v);
      paceDisplay.textContent = p ? formatPace(p) : '—';
    });

    // Totaaltijd + afstand → gem. snelheid
    const totalH    = document.getElementById('total-h');
    const totalM    = document.getElementById('total-m');
    const totalS    = document.getElementById('total-s');
    const totalDist = document.getElementById('total-dist');
    const avgKph    = document.getElementById('avg-kph');
    const avgPace   = document.getElementById('avg-pace');

    function updateAvg() {
      const h    = parseInt(totalH.value)    || 0;
      const m    = parseInt(totalM.value)    || 0;
      const s    = parseInt(totalS.value)    || 0;
      const dist = parseFloat(totalDist.value) || 0;
      const totalSec = h * 3600 + m * 60 + s;
      if (totalSec === 0 || dist === 0) {
        avgKph.innerHTML = '—';
        avgPace.textContent = '—';
        return;
      }
      const kph = dist / (totalSec / 3600);
      avgKph.innerHTML = formatKph(kph);
      const p = kphToPace(kph);
      avgPace.textContent = p ? formatPace(p) : '—';
    }

    totalH.addEventListener('input', () => {
      if (totalH.value.length >= 2) totalM.focus();
      updateAvg();
    });
    totalM.addEventListener('input', () => {
      if (parseInt(totalM.value) > 59) totalM.value = 59;
      if (totalM.value.length >= 2) totalS.focus();
      updateAvg();
    });
    totalS.addEventListener('input', () => {
      if (parseInt(totalS.value) > 59) totalS.value = 59;
      updateAvg();
    });
    totalDist.addEventListener('input', updateAvg);

    // Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
